<div class="relative w-[60px] h-full bg-zinc-200 flex flex-col gap-2 p-2 border-r border-zinc-300">
    <button (click)="setSelectTool()"
        class="w-full aspect-square flex items-center justify-center rounded-lg transition-all duration-200 hover:scale-105 active:scale-95"
        [ngClass]="selectSelected() ? 'bg-yellow-500 text-zinc-900 shadow-sm' : 'bg-white text-zinc-600 hover:bg-zinc-100 shadow-sm'"
        title="Select Tool">
        <span class="text-xl">👆</span>
    </button>
    <button (click)="setBrushTool()"
        class="w-full aspect-square flex items-center justify-center rounded-lg transition-all duration-200 hover:scale-105 active:scale-95"
        [ngClass]="brushSelected() ? 'bg-yellow-500 text-zinc-900 shadow-sm' : 'bg-white text-zinc-600 hover:bg-zinc-100 shadow-sm'"
        title="Brush Tool">
        <span class="text-xl">🖌️</span>
    </button>

    <button (click)="setRectangleTool()"
        class="w-full aspect-square flex items-center justify-center rounded-lg transition-all duration-200 hover:scale-105 active:scale-95"
        [ngClass]="rectangleSelected() ? 'bg-yellow-500 text-zinc-900 shadow-sm' : 'bg-white text-zinc-600 hover:bg-zinc-100 shadow-sm'"
        title="Rectangle Tool">
        <span class="text-xl font-bold">▭</span>
    </button>

    <div class="h-px bg-zinc-300 w-full my-2"></div>

    <div class="flex flex-col gap-1 items-center w-full">
        <label class="text-[10px] text-zinc-500 uppercase font-bold">Color</label>
        <input type="color" [value]="color()" (input)="onColorChange($event)"
            class="w-full h-8 rounded cursor-pointer border-none bg-transparent">
    </div>

    <div class="flex flex-col gap-1 items-center w-full">
        <label class="text-[10px] text-zinc-500 uppercase font-bold">Size</label>
        <input type="range" min="1" max="50" [value]="lineWidth()" (input)="onLineWidthChange($event)"
            class="w-full accent-yellow-500 h-1 bg-zinc-300 rounded-lg appearance-none cursor-pointer">
        <span class="text-xs text-zinc-600 font-mono">{{ lineWidth() }}px</span>
    </div>
</div>
