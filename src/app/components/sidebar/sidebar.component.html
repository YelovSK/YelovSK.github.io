<aside
    class="flex flex-col h-full bg-zinc-800 border-r border-zinc-700 shadow-xl overflow-x-hidden transition-[width] duration-300 ease-in-out whitespace-nowrap"
    [class.w-64]="!isCollapsed()" [class.w-20]="isCollapsed()">


    <div class="h-16 flex items-center px-4 shrink-0 transition-all duration-300 border-b border-zinc-700/50"
        [class.justify-between]="!isCollapsed()" [class.justify-center]="isCollapsed()">


        <div class="overflow-hidden transition-all duration-300" [class.w-0]="isCollapsed()"
            [class.opacity-0]="isCollapsed()" [class.mr-0]="isCollapsed()" [class.mr-4]="!isCollapsed()">

            <h1 class="text-xl font-bold tracking-tight text-yellow-400 bg-clip-text select-none whitespace-nowrap">
                Yelov
            </h1>
        </div>


        <button (click)="toggleCollapse()"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-zinc-400 hover:bg-zinc-700 hover:text-yellow-400 transition-colors focus:outline-none"
            title="Toggle Sidebar">
            <span class="material-icons transition-transform duration-300" [class.rotate-180]="isCollapsed()">
                first_page
            </span>
        </button>
    </div>


    <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto overflow-x-hidden">
        @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" [routerLinkActive]="['text-yellow-400', 'bg-zinc-700/50', 'border-yellow-500']"
            [routerLinkActiveOptions]="{ exact: item.exact || false }"
            class="group flex items-center h-10 rounded-lg text-zinc-400 hover:text-yellow-400 hover:bg-yellow-500/10 transition-all border-l-4 border-transparent min-w-0"
            [class.justify-center]="isCollapsed()" [class.px-3]="!isCollapsed()" [class.px-0]="isCollapsed()"
            [title]="isCollapsed() ? item.label : ''">

            <span class="material-icons text-lg w-6 h-6 shrink-0 transition-all duration-300"
                [class.mr-3]="!isCollapsed()" [class.mr-0]="isCollapsed()">
                {{ item.icon }}
            </span>

            <span class="truncate transition-opacity duration-200" [class.opacity-0]="isCollapsed()"
                [class.w-0]="isCollapsed()" [class.hidden]="isCollapsed()">
                {{ item.label }}
            </span>
        </a>
        }
    </nav>


    <div class="p-4 border-t border-zinc-700 shrink-0 flex justify-center">
        <a href="https://github.com/YelovSK" target="_blank"
            class="text-zinc-500 hover:text-yellow-400 transition-colors block text-center" title="GitHub">
            <span class="material-icons text-lg">code</span>
        </a>
    </div>

</aside>
